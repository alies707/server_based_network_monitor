name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run server tests
        env:
          PYTHONPATH: server
        run: python -m pytest -q server/tests

  client-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential git

      - name: Configure client
        run: cmake -S client -B client/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build client
        run: cmake --build client/build --parallel
