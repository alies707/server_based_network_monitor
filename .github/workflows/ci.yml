name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run server tests
        env:
          PYTHONPATH: server
        run: python -m pytest -q server/tests

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/requirements.txt

      - name: Install client dependencies
        run: python -m pip install -r client/requirements.txt pytest

      - name: Run client tests
        run: python -m pytest -q client/tests

      - name: Compile client package
        run: python -m compileall -q client/app
