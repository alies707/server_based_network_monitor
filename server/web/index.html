<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مانیتور شبکه</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box} body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}
    h1{margin:0 0 8px;font-size:28px}.sub{color:#687386;margin-bottom:22px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px}
    .card,.table-wrap{background:#fff;border:1px solid #e4e9f0;border-radius:14px;box-shadow:0 5px 18px #1720330d}
    .card{padding:18px}.label{color:#687386;font-size:13px}.value{font-size:24px;font-weight:700;margin-top:8px;direction:ltr;text-align:right}
    .table-wrap{overflow:auto}.toolbar{padding:16px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center}
    table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:15px 14px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}th{font-size:13px;color:#687386;background:#fafbfd}
    tr:last-child td{border-bottom:0}.client{font-weight:700}.ip,.number{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}.status{font-weight:700}.online{color:#159447}.offline{color:#9aa3b2}
    .empty{text-align:center;padding:45px;color:#687386}.refresh{font-size:12px;color:#687386}
    @media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}h1{font-size:22px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>مانیتور زنده شبکه</h1>
  <div class="sub">نمایش لحظه‌ای مصرف اینترنت کلاینت‌ها</div>
  <section class="summary">
    <div class="card"><div class="label">تعداد کل کلاینت</div><div id="clients" class="value">0</div></div>
    <div class="card"><div class="label">کلاینت‌های آنلاین</div><div id="online" class="value">0</div></div>
    <div class="card"><div class="label">مجموع دانلود لحظه‌ای</div><div id="download" class="value">0 bps</div></div>
    <div class="card"><div class="label">مجموع آپلود لحظه‌ای</div><div id="upload" class="value">0 bps</div></div>
  </section>
  <div class="table-wrap">
    <div class="toolbar"><strong>کلاینت‌ها</strong><span id="refresh" class="refresh">در حال اتصال...</span></div>
    <table>
      <thead><tr><th>کلاینت</th><th>IP عمومی</th><th>دانلود</th><th>آپلود</th><th>کل دانلود</th><th>کل آپلود</th><th>کل مصرف</th><th>وضعیت</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">هنوز کلاینتی متصل نشده است.</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const rows=document.getElementById('rows');
const fmtRate=bps=>{if(bps<1000)return `${bps.toFixed(0)} bps`;if(bps<1e6)return `${(bps/1e3).toFixed(1)} Kbps`;if(bps<1e9)return `${(bps/1e6).toFixed(2)} Mbps`;return `${(bps/1e9).toFixed(2)} Gbps`};
const fmtBytes=n=>{if(n<1024)return `${n} B`;if(n<1024**2)return `${(n/1024).toFixed(1)} KB`;if(n<1024**3)return `${(n/1024**2).toFixed(2)} MB`;if(n<1024**4)return `${(n/1024**3).toFixed(2)} GB`;return `${(n/1024**4).toFixed(2)} TB`};
function render(data){const cs=data.clients||[];const online=cs.filter(c=>c.online).length;const down=cs.reduce((s,c)=>s+c.download_bps,0),up=cs.reduce((s,c)=>s+c.upload_bps,0);document.getElementById('clients').textContent=cs.length;document.getElementById('online').textContent=online;document.getElementById('download').textContent=fmtRate(down);document.getElementById('upload').textContent=fmtRate(up);document.getElementById('refresh').textContent='به‌روزرسانی زنده';if(!cs.length){rows.innerHTML='<tr><td colspan="8" class="empty">هنوز کلاینتی متصل نشده است.</td></tr>';return}rows.innerHTML=cs.map(c=>`<tr><td class="client">${escapeHtml(c.client_id)}</td><td class="ip">${escapeHtml(c.public_ip||'-')}</td><td class="number">↓ ${fmtRate(c.download_bps)}</td><td class="number">↑ ${fmtRate(c.upload_bps)}</td><td class="number">${fmtBytes(c.total_download_bytes)}</td><td class="number">${fmtBytes(c.total_upload_bytes)}</td><td class="number">${fmtBytes(c.total_traffic_bytes)}</td><td class="status ${c.online?'online':'offline'}">${c.online?'● آنلاین':'● آفلاین'}</td></tr>`).join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${proto}://${location.host}/ws/dashboard`);ws.onopen=()=>document.getElementById('refresh').textContent='اتصال برقرار است';ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>{document.getElementById('refresh').textContent='اتصال قطع شد؛ تلاش مجدد...';setTimeout(connect,2000)};ws.onerror=()=>ws.close()}
connect();
</script>
</body>
</html>
